version: 1

project:
  name: ml-face-recognition
  task: face-metric-learning
  experiment: arcface
  notes: "ArcFace (Additive Angular Margin Loss) — Deng et al., CVPR 2019."

output:
  root_dir: experiments/runs
  run_name: auto
  naming:
    use_timestamp: true
    include_experiment: true
  dirs:
    logs: logs
    checkpoints: checkpoints
    metrics: metrics
    artifacts: artifacts
  save_resolved_config: true

system:
  seed: 42
  deterministic: false
  benchmark: true
  device: auto
  num_workers: 8
  pin_memory: true
  amp: true

data:
  dataset_name: casia-webface
  root_dir: data/casia-webface
  split_file: data/splits/casia_identity_split_v1.json
  auto_download: false
  download_source: kaggle
  dataset_ref: debarghamitraroy/casia-webface
  image_size: 224
  channels: 3
  debug_subset:
    enabled: false
    max_identities: null
    max_images_per_identity: null

model:
  backbone: resnet18
  pretrained: true
  embedding_dim: 512
  # ArcFace requires L2-normalised embeddings — forced True by train.py even if
  # set to false here, but kept explicit for clarity.
  normalize_embeddings: true
  classifier_head:
    enabled: false   # ArcFace head lives inside the loss, not the model
    num_classes: null

loss:
  name: arcface
  params:
    # Feature scale. Paper (Deng et al., Table 2) uses s=64 on CASIA.
    # With a smaller backbone (ResNet18) and AdamW, s=64 should still
    # converge; fall back to s=30 if training is unstable in early epochs.
    s: 64.0
    # Angular margin in radians. m=0.5 is confirmed as optimal on CASIA
    # across the paper's ablation study (Table 2: m in {0.4, 0.45, 0.5, 0.55}).
    m: 0.5
    # Number of sub-centers per class (k=1 is standard ArcFace, k=3 in Sub-center ArcFace paper)
    k: 3
    # easy_margin=true only applies the margin when cos(θ) > 0.
    # Recommended: false (standard formulation from the paper).
    easy_margin: false

train:
  epochs: 60
  batch_size: 512
  eval_every: 1
  log_every_steps: 100
  optimizer:
    name: adamw
    lr: 0.0001          # slightly lower than cross-entropy baseline (0.0003)
    weight_decay: 0.0001
  scheduler:
    name: cosine
    params:
      t_max: 60
      min_lr: 0.000001
  early_stopping:
    enabled: false
    patience: 10
    min_delta: 0.001
    min_epochs: 10
  grad_clip:
    enabled: true
    max_norm: 5.0

retrieval_eval:
  enabled: true
  distance: cosine
  l2_normalize: true    # embeddings are already L2-normalised by the model
  topk: [1, 5, 10]
  batch_size: 128

logging:
  level: INFO
  tensorboard:
    enabled: true
    subdir: tb
  json_metrics: true

checkpoint:
  resume_from: null
  save_last: true
  save_best: true
  save_every_n_epochs: 5
  monitor: val_map_at_5
  mode: max
